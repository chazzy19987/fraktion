<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ops board — Fraktion</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/fraktion.css?v=5">
  <style>
    .loading { min-height: 100vh; display: grid; place-items: center; color: var(--muted); }
    .stats5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; }
    .day-head { display: flex; align-items: baseline; gap: 10px; margin: 28px 0 10px; }
    .day-head h3 { font-size: 17px; }
    .day-head .hint { font-family: var(--mono); font-size: 12px; }
    .stop { display: grid; grid-template-columns: 110px 1fr 1.25fr 200px; gap: 16px; align-items: start; padding: 16px 18px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); }
    .stop + .stop { margin-top: 10px; }
    .stop.is-done { opacity: .6; }
    .stop .win { font-weight: 700; }
    .stop .win small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; }
    .stop .who b { display: block; }
    .stop .who span { display: block; font-size: 13px; color: var(--muted); }
    .stop .what { font-size: 14px; display: grid; gap: 6px; }
    .stop .what .bins { display: flex; flex-wrap: wrap; gap: 6px; }
    .stop .what .bins span { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--paper); border: 1px solid var(--line); font-family: var(--mono); }
    .stop .acts { display: grid; gap: 6px; justify-items: end; }
    .stop .acts .row { display: flex; gap: 6px; }
    .note { font-size: 13px; padding: 6px 10px; border-radius: 8px; background: var(--yellow-soft); }
    .tbl-input { min-height: 34px; padding: 4px 8px; font-size: 14px; border-radius: 7px; width: 100%; }
    .admin-tag { font-family: var(--mono); font-size: 11px; color: var(--yellow); letter-spacing: .1em; padding: 0 8px; }
    @media (max-width: 1100px) { .stop { grid-template-columns: 1fr 1fr; } .stop .acts { grid-column: 1 / -1; justify-items: start; } }
    @media (max-width: 960px) { .stats5 { grid-template-columns: repeat(2, 1fr); } .mobile-nav { grid-template-columns: repeat(5, 1fr) !important; } }
    @media (max-width: 560px) { .stop { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<div id="demo-banner"></div>
<div id="root"><div class="loading">Loading the ops board…</div></div>
<script type="module" src="assets/js/admin.js?v=5"></script>
</body>
</html>
