<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My bins — Fraktion</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/fraktion.css">
  <style>
    .loading { min-height: 100vh; display: grid; place-items: center; color: var(--muted); }
    .welcome-hero { display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: center; padding: 26px; border-radius: var(--r-xl); background: var(--ink); color: #fff; margin-bottom: 22px; }
    .welcome-hero h2 { font-size: 26px; font-stretch: 115%; }
    .welcome-hero p { color: #B3AFA3; margin-top: 6px; }
    .active-req { padding: 18px 20px; }
    .active-req + .active-req { margin-top: 12px; }
    .req-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; flex-wrap: wrap; }
    .req-bins { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
    .req-bins span { font-size: 13px; padding: 3px 9px; border-radius: 7px; background: var(--paper); border: 1px solid var(--line); }
    .bin-actions { display: flex; gap: 6px; align-items: center; }
    .addr-box { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 12px 14px; border-radius: var(--r); border: 1px solid var(--line); background: #FCFBF7; font-size: 14px; margin-top: 14px; }
    .pick-list { display: grid; gap: 8px; max-height: 240px; overflow: auto; }
    .pick { display: flex; gap: 12px; align-items: center; padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--r); cursor: pointer; }
    .pick:has(input:checked) { border-color: var(--ink); background: var(--yellow-soft); }
    .pick input { width: 18px; height: 18px; accent-color: var(--ink); }
    .pick .bin-emoji { width: 34px; height: 34px; font-size: 18px; border-radius: 9px; }
    .acct-grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 18px; align-items: start; }
    .plan-now { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .plan-now h3 { font-size: 26px; font-stretch: 115%; }
    .kv { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; font-size: 14px; margin-top: 16px; }
    .kv dt { color: var(--muted); }
    .kv dd { margin: 0; font-weight: 600; text-align: right; }
    @media (max-width: 960px) {
      .acct-grid { grid-template-columns: 1fr; }
      .welcome-hero { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div id="demo-banner"></div>
<div id="root"><div class="loading">Loading your bins…</div></div>
<script type="module" src="assets/js/app.js"></script>
</body>
</html>
